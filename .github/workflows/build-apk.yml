name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Auto Bump Version
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('app.json'));
            data.expo.android.versionCode = ${{ github.run_number }};
            data.expo.version = '1.2.${{ github.run_number }}';
            fs.writeFileSync('app.json', JSON.stringify(data, null, 2));
            console.log('v' + data.expo.version + ' (code: ' + data.expo.android.versionCode + ')');
          "

      - name: Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure APK Signing
        run: |
          echo "KEY_ALIAS=${{ secrets.ANDROID_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_STORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_BASE64=${{ secrets.ANDROID_SIGNING_KEY }}" >> $GITHUB_ENV

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease

      - name: List SDK build tools
        run: ls /usr/local/lib/android/sdk/build-tools/

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ env.KEY_BASE64 }}
          alias: ${{ env.KEY_ALIAS }}
          keyStorePassword: ${{ env.KEY_STORE_PASS }}
          keyPassword: ${{ env.KEY_PASS }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          retention-days: 5

      - name: Generate Release Notes
        run: |
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            let logText = '';
            try {
              logText = execSync('git log -n 5 --pretty=format:\"- %s (%h)\"').toString();
            } catch (e) {}
            const lines = [
              '## 📱 Unraid Mobile Manager v1.2.${{ github.run_number }}',
              '',
              '### 🌟 本次版本核心更新与功能特性 (Highlights)',
              '- 🔄 **应用内在线检查更新与一键安装 (In-App Updates)**：在设置中心新增“软件版本与在线更新”专区，支持一键直连 GitHub Releases 智能对比版本号。当有新版本时，自动弹出包含版本号、安装包大小及详细更新日志的精致弹窗，支持一键跳转下载并完成无缝升级。',
              '- 🔒 **生物识别应用锁与高危操作守卫 (Biometric Security Guard)**：深度集成系统原生指纹/面容识别能力，支持应用启动与从后台切换回前台时的全屏安全锁屏；对服务器重启、关机等高危运维指令增加生物识别二次鉴权确认，全方位守护 NAS 数据安全。',
              '- 💾 **传输任务队列持久化与断点自愈 (Persistent Queue & Auto-Resume)**：全面实现传输任务队列的本地持久化存储（@transfers_queue_v1）。无论应用意外闪退、被系统后台查杀或用户主动退出重开，未完成的上传/下载队列、精确到字节与切片索引的进度百分比均能完整恢复，支持随时一键断点续传。',
              '- 🛠️ **传输任务中心全面优化**：独立三列定宽等宽数字排版彻底根除网速位置跳动，右上角拟物胶囊触控按键防误触，全面提升交互质感。',
              '',
              '### 📦 提交历史目录 (Changelog)',
              logText,
              '',
              '### 📥 下载与服务端同步',
              '- **Android 客户端**: 请下载下方 Assets 中的 \`unraid-v1.2.${{ github.run_number }}.apk\`',
              '- **服务端 API 脚本**: 请在 Unraid 服务器端同步更新 \`/usr/local/emhttp/api.php\` 并执行 \`chmod 755 /usr/local/emhttp/api.php\`'
            ];
            fs.writeFileSync('release_notes.md', lines.join('\n'));
          "

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.2.${{ github.run_number }}
          release_name: Unraid v1.2.${{ github.run_number }}
          body_path: release_notes.md
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          asset_name: unraid-v1.2.${{ github.run_number }}.apk
          asset_content_type: application/vnd.android.package-archive
