name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Auto Bump Version
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('app.json'));
            data.expo.android.versionCode = ${{ github.run_number }};
            data.expo.version = '1.3.${{ github.run_number }}';
            fs.writeFileSync('app.json', JSON.stringify(data, null, 2));
            console.log('v' + data.expo.version + ' (code: ' + data.expo.android.versionCode + ')');
          "

      - name: Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure APK Signing
        run: |
          echo "KEY_ALIAS=${{ secrets.ANDROID_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_STORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_BASE64=${{ secrets.ANDROID_SIGNING_KEY }}" >> $GITHUB_ENV

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease

      - name: List SDK build tools
        run: ls /usr/local/lib/android/sdk/build-tools/

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ env.KEY_BASE64 }}
          alias: ${{ env.KEY_ALIAS }}
          keyStorePassword: ${{ env.KEY_STORE_PASS }}
          keyPassword: ${{ env.KEY_PASS }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          retention-days: 5

      - name: Generate Release Notes
        run: |
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            let logText = '';
            try {
              logText = execSync('git log -n 5 --pretty=format:\"- %s (%h)\"').toString();
            } catch (e) {}
            const lines = [
              '## 📱 Unraid Mobile Manager v1.3.${{ github.run_number }}',
              '',
              '### 🌟 本次版本核心更新与功能特性 (P1 里程碑 Highlights)',
              '- 🐳 **Docker 容器实时日志流与 WebUI 直达**：容器详情页集成全功能极客终端风格实时日志弹窗（Monospace 等宽字体、关键字实时过滤检索、一键复制全部日志并附带操作反馈）；自动智能解析容器映射端口，为运行中的容器提供 WebUI 一键直达快捷启动。',
              '- 🛡️ **阵列奇偶校验实时监控与生命周期运维**：仪表盘全新上线“阵列奇偶校验”卡片，实时掌握校验状态、同步进度百分比、MB/s 读写速率、预计完成倒计时及错误计数；支持手动触发启动校验、暂停、恢复与安全终止生命周期操作。',
              '- 📜 **系统日志 (Syslog) 实时查看器**：仪表盘支持一键呼出系统日志中心（读取 `/var/log/syslog` 尾部实时流），支持全部 / 错误 / 警告 / 信息多级别过滤标签、实时关键字搜索与一键剪贴板复制。',
              '- 💻 **虚拟机高级电源管理与状态调度**：虚拟机管理全面支持挂起/暂停（`virsh suspend`）、恢复运行（`virsh resume`）、ACPI 正常关机、强制断电（`virsh destroy`）以及快速重启；全面接入现代化 Squircle 圆角二次防误触确认弹窗。',
              '- 🔄 **应用内在线更新与安全加固**：全面联动服务端 API 与 GitHub Releases，持续提升手机端运维流畅度与安全性。',
              '',
              '### 📦 提交历史目录 (Changelog)',
              logText,
              '',
              '### 📥 下载与服务端同步',
              '- **Android 客户端**: 请下载下方 Assets 中的 \`unraid-v1.3.${{ github.run_number }}.apk\`',
              '- **服务端 API 脚本**: 请在 Unraid 服务器端同步更新 \`/usr/local/emhttp/api.php\` 并执行 \`chmod 755 /usr/local/emhttp/api.php\`'
            ];
            fs.writeFileSync('release_notes.md', lines.join('\n'));
          "

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.3.${{ github.run_number }}
          release_name: Unraid v1.3.${{ github.run_number }}
          body_path: release_notes.md
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          asset_name: unraid-v1.3.${{ github.run_number }}.apk
          asset_content_type: application/vnd.android.package-archive
