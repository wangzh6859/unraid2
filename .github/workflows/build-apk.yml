name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Patch Native Dependencies
        run: node scripts/patch-background-actions.js

      - name: Auto Bump Version
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('app.json'));
            data.expo.android.versionCode = ${{ github.run_number }};
            data.expo.version = '1.3.${{ github.run_number }}';
            fs.writeFileSync('app.json', JSON.stringify(data, null, 2));
            console.log('v' + data.expo.version + ' (code: ' + data.expo.android.versionCode + ')');
          "

      - name: Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Setup Wake-on-LAN Native Module
        run: node scripts/setup-wake-on-lan.js

      - name: Configure APK Signing
        run: |
          echo "KEY_ALIAS=${{ secrets.ANDROID_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_STORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_BASE64=${{ secrets.ANDROID_SIGNING_KEY }}" >> $GITHUB_ENV

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease

      - name: List SDK build tools
        run: ls /usr/local/lib/android/sdk/build-tools/

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ env.KEY_BASE64 }}
          alias: ${{ env.KEY_ALIAS }}
          keyStorePassword: ${{ env.KEY_STORE_PASS }}
          keyPassword: ${{ env.KEY_PASS }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          retention-days: 5

      - name: Generate Release Notes
        run: |
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            let logText = '';
            try {
              logText = execSync('git log -n 5 --pretty=format:\"- %s (%h)\"').toString();
            } catch (e) {}
            const lines = [
              '## 📱 Unraid Mobile Manager v1.3.${{ github.run_number }}',
              '',
              '### 🌟 本次版本核心更新与功能特性',
              '- ⚡ **新增网络唤醒远程开机 (Wake-on-LAN / WOL)**：深度集成 Android 原生 UDP 广播底层，支持向局域网广播 Magic Packet 唤醒魔术包。',
              '- 🔍 **物理 MAC 地址自动探测**：服务器端自动抓取物理网卡 MAC 地址并在 App 连接时静默同步缓存，彻底免去手动输入背诵繁琐。',
              '- 🔌 **离线智能感知与一键唤醒**：首页检测到 Unraid 离线或关机时，自动弹出醒目的网络唤醒卡片；点击一键唤醒并自动轮询等待服务器上线。',
              '- ⚙️ **设置页 WOL 深度配置与快速测试**：支持自定义或修改物理 MAC、局域网广播 IP（默认 255.255.255.255）及唤醒端口（默认 9），并支持一键测试广播。',
              '- 🛡️ **远程电源管理全闭环**：与此前的安全锁远程关机、重启相配合，实现全生命周期无忧远程电源中控。',
              '',
              '### 📦 提交历史目录 (Changelog)',
              logText,
              '',
              '### 📥 下载与服务端同步',
              '- **Android 客户端**: 请下载下方 Assets 中的 \`unraid-v1.3.${{ github.run_number }}.apk\`',
              '- **服务端 API 脚本**: 请在 Unraid 服务器端同步更新 \`/usr/local/emhttp/api.php\` 并执行 \`chmod 755 /usr/local/emhttp/api.php\`'
            ];
            fs.writeFileSync('release_notes.md', lines.join('\n'));
          "

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.3.${{ github.run_number }}
          release_name: Unraid v1.3.${{ github.run_number }}
          body_path: release_notes.md
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          asset_name: unraid-v1.3.${{ github.run_number }}.apk
          asset_content_type: application/vnd.android.package-archive
