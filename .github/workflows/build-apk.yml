name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Patch Native Dependencies
        run: node scripts/patch-background-actions.js

      - name: Auto Bump Version
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('app.json'));
            data.expo.android.versionCode = ${{ github.run_number }};
            data.expo.version = '1.3.${{ github.run_number }}';
            fs.writeFileSync('app.json', JSON.stringify(data, null, 2));
            console.log('v' + data.expo.version + ' (code: ' + data.expo.android.versionCode + ')');
          "

      - name: Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure APK Signing
        run: |
          echo "KEY_ALIAS=${{ secrets.ANDROID_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_STORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_BASE64=${{ secrets.ANDROID_SIGNING_KEY }}" >> $GITHUB_ENV

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease

      - name: List SDK build tools
        run: ls /usr/local/lib/android/sdk/build-tools/

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ env.KEY_BASE64 }}
          alias: ${{ env.KEY_ALIAS }}
          keyStorePassword: ${{ env.KEY_STORE_PASS }}
          keyPassword: ${{ env.KEY_PASS }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          retention-days: 5

      - name: Generate Release Notes
        run: |
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            let logText = '';
            try {
              logText = execSync('git log -n 5 --pretty=format:\"- %s (%h)\"').toString();
            } catch (e) {}
            const lines = [
              '## 📱 Unraid Mobile Manager v1.3.${{ github.run_number }}',
              '',
              '### 🌟 本次版本核心更新与功能特性',
              '- 🐛 **修复首次上传闪退**：深度适配 Android 14 前台服务规范，增加 FGS dataSync 显式类型保护与生命周期平滑过渡，底层 Throwable 兜底捕获，彻底根除应用首次上传闪退问题。',
              '- 📦 **修复文件压缩与解压 JSON 解析异常**：优化请求体传输机制（切换为原生 JSON POST），服务端支持 CLI 工具与 PHP ZipArchive 双重打包解压引擎，消除 JSON parse error: unexpected end of input 异常。',
              '- 🚀 **通知栏点击直达跳转修复**：修复点击通知栏上传进度时手机弹出“选择应用”的系统 Intent 冲突缺陷，显式包名与 singleTask 强锁定，点击通知栏秒速聚焦 Unraid 并直达传输管理。',
              '- 🛡️ **生物识别安全锁 (防误触 & 3分钟超时)**：智能忽略下拉状态栏与快捷开关，仅在应用启动及切入后台超过 3 分钟后要求指纹验证。',
              '- ⚡ **Android 前台服务持续传输**：全场景覆盖大文件分片上传与小文件直传，锁屏与切后台平稳保活。',
              '',
              '### 📦 提交历史目录 (Changelog)',
              logText,
              '',
              '### 📥 下载与服务端同步',
              '- **Android 客户端**: 请下载下方 Assets 中的 \`unraid-v1.3.${{ github.run_number }}.apk\`',
              '- **服务端 API 脚本**: 请在 Unraid 服务器端同步更新 \`/usr/local/emhttp/api.php\` 并执行 \`chmod 755 /usr/local/emhttp/api.php\`'
            ];
            fs.writeFileSync('release_notes.md', lines.join('\n'));
          "

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.3.${{ github.run_number }}
          release_name: Unraid v1.3.${{ github.run_number }}
          body_path: release_notes.md
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          asset_name: unraid-v1.3.${{ github.run_number }}.apk
          asset_content_type: application/vnd.android.package-archive
