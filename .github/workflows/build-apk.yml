name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Auto Bump Version
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('app.json'));
            data.expo.android.versionCode = ${{ github.run_number }};
            data.expo.version = '1.1.${{ github.run_number }}';
            fs.writeFileSync('app.json', JSON.stringify(data, null, 2));
            console.log('v' + data.expo.version + ' (code: ' + data.expo.android.versionCode + ')');
          "

      - name: Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure APK Signing
        run: |
          echo "KEY_ALIAS=${{ secrets.ANDROID_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_STORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_BASE64=${{ secrets.ANDROID_SIGNING_KEY }}" >> $GITHUB_ENV

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease

      - name: List SDK build tools
        run: ls /usr/local/lib/android/sdk/build-tools/

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ env.KEY_BASE64 }}
          alias: ${{ env.KEY_ALIAS }}
          keyStorePassword: ${{ env.KEY_STORE_PASS }}
          keyPassword: ${{ env.KEY_PASS }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          retention-days: 5

      - name: Generate Release Notes
        run: |
          cat > release_notes.md << 'EOF'
## 📱 Unraid Mobile Manager v1.1.${{ github.run_number }}

### 🌟 本次版本核心更新与修复 (Highlights)
- 🛡️ **解决上传 0 字节与网关拦截问题**：支持 Unraid 系统级 CSRF Token 动态认证，彻底解决 `emhttp` 与反向代理静默拦截 POST 上传的问题。
- ⚡ **全协议兼容三重弹性上传引擎**：
  1. **原生流式直传**（带 CSRF 动态令牌认证与全头部校验）；
  2. **64KB 表单分片引擎**（绕过 PHP 2M/8M 与 Nginx 限制）；
  3. **4KB 微切片 GET 容灾引擎**（针对任何严苛代理/网关环境确保 100% 可写）。
- 🌐 **跨域预检与空响应防护**：完善 OPTIONS 预检请求即时响应机制，杜绝 204 空体截断。
- 📋 **规范化 Release 更新目录**：自动化生成清晰的提交历史与更新目录说明。

### 📦 提交历史目录 (Changelog)
EOF
          git log -n 5 --pretty=format:"- %s (%h)" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 📥 下载与服务端同步" >> release_notes.md
          echo "- **Android 客户端**: 请下载下方 Assets 中的 \`unraid-v1.1.${{ github.run_number }}.apk\`" >> release_notes.md
          echo "- **服务端 API 脚本**: 请在 Unraid 服务器端同步更新 \`/usr/local/emhttp/api.php\` 并执行 \`chmod 755 /usr/local/emhttp/api.php\`" >> release_notes.md

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.1.${{ github.run_number }}
          release_name: Unraid v1.1.${{ github.run_number }}
          body_path: release_notes.md
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          asset_name: unraid-v1.1.${{ github.run_number }}.apk
          asset_content_type: application/vnd.android.package-archive
